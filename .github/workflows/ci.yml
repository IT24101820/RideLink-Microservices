name: RideLink Microservices CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ridelink_account_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Create additional MySQL database for Ride Service
      - name: Create Ride Database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -e "CREATE DATABASE IF NOT EXISTS ridelink_ride_db;"

      # 4. Test Account Service
      - name: Test Account Service
        run: |
          cd account-service
          chmod +x mvnw
          ./mvnw test \
            -Dspring.datasource.url="jdbc:mysql://localhost:3306/ridelink_account_db" \
            -Dspring.datasource.username="root" \
            -Dspring.datasource.password="" \
            -Djwt.secret="ridelinksecretkeyforci12345678901234567890"

      # 5. Test Driver & Vehicle Service
      - name: Test Driver & Vehicle Service
        run: |
          cd driver-vehicle-service
          chmod +x mvnw
          ./mvnw test \
            -Dspring.mongodb.uri="mongodb://localhost:27017/ridelink_driver_vehicle"

      # 6. Test Ride Management Service
      - name: Test Ride Management Service
        run: |
          cd ride-service
          chmod +x mvnw
          ./mvnw test \
            -Dspring.datasource.url="jdbc:mysql://localhost:3306/ridelink_ride_db" \
            -Dspring.datasource.username="root" \
            -Dspring.datasource.password=""

      # 7. Test Fare & Payment Service
      - name: Test Fare & Payment Service
        run: |
          cd fare-payment-service
          chmod +x mvnw
          ./mvnw test \
            -Dspring.mongodb.uri="mongodb://localhost:27017/ridelink_fare_payment"
