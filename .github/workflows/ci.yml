name: RideLink Microservices CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ridelink_account_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Test Account Service
      run: |
        cd account-service
        chmod +x mvnw
        ./mvnw test -Dspring.datasource.url="jdbc:mysql://localhost:3306/ridelink_account_db" -Dspring.datasource.username="root" -Dspring.datasource.password="" -Djwt.secret="ridelinksecretkeyforci12345678901234567890"

    - name: Test Driver & Vehicle Service
      run: |
        cd driver-vehicle-service
        chmod +x mvnw
        ./mvnw test -Dspring.mongodb.uri="mongodb://localhost:27017/ridelink_driver_vehicle"

    - name: Test Ride Management Service
      run: |
        cd ride-service
        chmod +x mvnw
        ./mvnw test -Dspring.datasource.url="jdbc:mysql://localhost:3306/ridelink_ride_db" -Dspring.datasource.username="root" -Dspring.datasource.password=""

    - name: Test Fare & Payment Service
      run: |
        cd fare-payment-service
        chmod +x mvnw
        ./mvnw test -Dspring.mongodb.uri="mongodb://localhost:27017/ridelink_fare_payment"
